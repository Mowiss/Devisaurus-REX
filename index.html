<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEVISAURE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Comfortaa', cursive; 
            background-color: #09090b; 
            color: #d4d4d8;
        }

        /* --- RESET COMPLET --- */
        input, select, textarea {
            -webkit-appearance: none !important;
            -moz-appearance: none !important;
            appearance: none !important;
            border-radius: 0;
            margin: 0;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none !important; margin: 0; }
        
        /* --- CHAMP DE SAISIE ORANGE --- */
        .orange-pill {
            background-color: #f97316 !important;
            border: 2px solid #ea580c !important;
            border-radius: 9999px !important;
            padding: 0.375rem 0.75rem !important;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.3) !important;
            transition: all 0.2s ease;
        }
        .orange-pill:focus-within {
            border-color: #ffffff !important;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.2), inset 0 3px 6px rgba(0,0,0,0.3) !important;
        }
        .orange-pill-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #431407 !important;
            font-weight: 800;
            margin-bottom: 2px;
        }
        .orange-pill-input {
            background: transparent !important;
            border: none !important;
            color: #000000 !important;
            font-weight: 900 !important;
            font-size: 0.9rem !important;
            padding: 0 !important;
            outline: none !important;
            box-shadow: none !important;
            width: 100%;
            line-height: 1.2 !important;
        }

        /* --- AFFICHAGE RÉSULTAT --- */
        .dark-pill-display {
            background-color: #121214 !important;
            border: 1px solid #27272a !important;
            border-radius: 9999px !important;
            padding: 0.375rem 0.75rem !important;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            min-width: 90px;
        }
        .dark-pill-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #71717a !important;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .dark-pill-value {
            color: #f59e0b !important;
            font-family: monospace;
            font-size: 0.9rem !important;
            font-weight: 800 !important;
            line-height: 1.2 !important;
        }

        /* --- BOUTONS CLAVIER --- */
        .kbd-btn {
            background: linear-gradient(180deg, #3f3f46 0%, #27272a 100%);
            border: 1px solid #52525b;
            border-bottom-color: #18181b;
            border-bottom-width: 4px;
            border-radius: 8px;
            color: #e4e4e7;
            cursor: pointer;
            font-weight: 700;
            padding: 0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            transition: all 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            user-select: none;
        }
        .kbd-btn:active {
            border-bottom-width: 1px;
            transform: translateY(3px);
        }
        .kbd-btn-amber {
            background: linear-gradient(180deg, #d97706 0%, #b45309 100%);
            border-color: #f59e0b;
            border-bottom-color: #78350f;
            color: #fff;
        }
        .kbd-btn-red {
            background: linear-gradient(180deg, #991b1b 0%, #7f1d1d 100%);
            border-color: #ef4444;
            border-bottom-color: #450a0a;
            color: #fff;
        }
        .kbd-icon { font-size: 1.25rem; line-height: 1; }

        /* --- CARDS & ITEMS --- */
        .item-card {
            @apply bg-[#121214] border border-zinc-800 rounded-2xl p-2 mb-1 transition-all shadow-lg relative flex flex-col;
        }
        .item-card.dragging {
            opacity: 0.3;
            transform: scale(0.98);
            border: 2px dashed #f97316;
        }
        .item-card.drag-over {
            border-top: 4px solid #f97316;
            margin-top: 10px;
        }

        /* Mode Suppression */
        body.delete-mode-active {
            cursor: crosshair;
        }
        body.delete-mode-active .item-card {
            @apply hover:border-red-500 hover:bg-red-900/20 cursor-pointer;
        }
        body.delete-mode-active .item-card * {
            pointer-events: none;
        }

        /* Sous-total automatique */
        .subtotal-row {
            @apply flex items-center gap-2 py-3 px-6 mb-4 mt-2 bg-zinc-900/50 border border-dashed border-zinc-800 rounded-2xl;
        }

        .type-indicator { @apply w-1.5 h-full absolute left-0 top-0 bottom-0 rounded-l-2xl; }
        .type-indicator-article { @apply bg-zinc-500; }
        .type-indicator-indice { @apply bg-white; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen p-4 pr-20 md:p-6 md:pr-24 flex flex-col items-center">

    <div class="w-full max-w-7xl">
        
        <!-- Logo -->
        <div class="mb-8 flex items-center gap-3">
            <span class="text-4xl drop-shadow-lg">🦖</span>
            <h1 class="text-3xl font-black text-white tracking-tighter uppercase drop-shadow-md">Devisaure</h1>
        </div>

        <!-- Items Container -->
        <div id="items-container" class="space-y-1 min-h-[300px]"></div>
        
        <!-- Total Général -->
        <div class="mt-8 bg-[#121214] border border-amber-900/30 rounded-3xl p-6 flex flex-col md:flex-row justify-between items-center shadow-2xl relative overflow-hidden gap-6">
            <div class="absolute inset-0 bg-gradient-to-r from-amber-500/5 to-transparent pointer-events-none"></div>
            <h2 class="text-xl font-bold text-white uppercase tracking-wider z-10">Total Général du Chantier</h2>
            
            <div class="flex flex-col items-end gap-2 z-10 min-w-[300px]">
                <div class="flex justify-between w-full text-zinc-400 font-mono text-lg text-right"><span>Total HT :</span><span id="total-ht">0.00 €</span></div>
                <div class="flex justify-between w-full text-zinc-400 font-mono text-lg items-center border-b border-zinc-800 pb-2">
                    <div class="flex items-center gap-2">
                        <span>TVA</span>
                        <select onchange="updateTva(this.value)" class="bg-zinc-900 border border-zinc-700 text-amber-500 text-xs rounded px-1 py-0.5 outline-none cursor-pointer">
                            <option value="0.20" selected>20%</option>
                            <option value="0.10">10%</option>
                            <option value="0.055">5.5%</option>
                            <option value="0">0%</option>
                        </select>
                        <span>:</span>
                    </div>
                    <span id="montant-tva">0.00 €</span>
                </div>
                <div class="flex justify-between w-full font-mono text-3xl font-bold text-amber-500 pt-1"><span>TTC :</span><span id="total-ttc">0.00 €</span></div>
            </div>
        </div>
    </div>

    <!-- Barre d'outils verticale à droite -->
    <div class="fixed right-0 top-0 h-screen w-16 z-50 flex flex-col items-center justify-start pt-6 gap-3 bg-zinc-900 border-l border-zinc-800 shadow-2xl">
        <button onclick="addItem('indice')" class="kbd-btn group relative">
            <span class="kbd-icon">🏷️</span>
            <span class="absolute right-full mr-3 top-1/2 -translate-y-1/2 px-3 py-1.5 bg-zinc-800 text-zinc-200 text-xs font-bold rounded-lg opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity whitespace-nowrap border border-zinc-700 shadow-xl">Ajouter Indice (Section)</span>
        </button>
        <button onclick="addItem('article')" class="kbd-btn group relative">
            <span class="kbd-icon">📦</span>
            <span class="absolute right-full mr-3 top-1/2 -translate-y-1/2 px-3 py-1.5 bg-zinc-800 text-zinc-200 text-xs font-bold rounded-lg opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity whitespace-nowrap border border-zinc-700 shadow-xl">Ajouter Article</span>
        </button>
        <button onclick="toggleDeleteMode()" id="delete-tool-btn" class="kbd-btn group relative">
            <span class="kbd-icon text-red-500">❌</span>
            <span class="absolute right-full mr-3 top-1/2 -translate-y-1/2 px-3 py-1.5 bg-zinc-800 text-red-400 text-xs font-bold rounded-lg opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity whitespace-nowrap border border-zinc-700 shadow-xl">Mode Suppression</span>
        </button>

        <div class="w-10 h-px bg-zinc-800 my-1"></div>

        <button onclick="exportData()" class="kbd-btn group relative">
            <span class="kbd-icon text-blue-400">💾</span>
            <span class="absolute right-full mr-3 top-1/2 -translate-y-1/2 px-3 py-1.5 bg-zinc-800 text-blue-300 text-xs font-bold rounded-lg opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity whitespace-nowrap border border-zinc-700 shadow-xl">Sauvegarder JSON</span>
        </button>
        <button onclick="document.getElementById('import-file').click()" class="kbd-btn group relative">
            <span class="kbd-icon text-emerald-400">📂</span>
            <span class="absolute right-full mr-3 top-1/2 -translate-y-1/2 px-3 py-1.5 bg-zinc-800 text-emerald-300 text-xs font-bold rounded-lg opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity whitespace-nowrap border border-zinc-700 shadow-xl">Charger JSON</span>
        </button>
        <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
        
        <div class="w-10 h-px bg-zinc-800 my-1"></div>

        <button id="btn-generate" onclick="generateImage()" class="kbd-btn kbd-btn-amber group relative">
            <span class="kbd-icon">🖨️</span>
            <span id="btn-generate-text" class="absolute right-full mr-3 top-1/2 -translate-y-1/2 px-3 py-1.5 bg-amber-600 text-white text-xs font-bold rounded-lg opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity whitespace-nowrap border border-amber-500 shadow-xl">Générer Image</span>
        </button>
    </div>

    <!-- Tiroir Sous-Détail -->
    <div id="subdetail-drawer" class="fixed top-0 left-0 h-full w-full xl:w-[85vw] bg-zinc-950 border-r border-zinc-800 shadow-[20px_0_50px_rgba(0,0,0,0.5)] z-[100] transform -translate-x-full transition-transform duration-300 flex flex-col">
        <div class="flex justify-between items-center p-3 border-b border-zinc-800 bg-zinc-900 shrink-0">
            <h2 class="text-white font-bold flex items-center gap-2 tracking-widest uppercase"><span class="text-xl">🧮</span> Sous-Détail de Prix</h2>
            <button onclick="closeSubDetail()" class="text-zinc-400 hover:text-rose-500 font-bold px-4 py-2 bg-black rounded-lg flex items-center gap-2 transition-colors border border-zinc-800 shadow-inner">
                FERMER ❌
            </button>
        </div>
        <iframe id="subdetail-frame" class="flex-1 w-full border-none bg-[#000000]"></iframe>
    </div>

    <canvas id="export-canvas" class="hidden"></canvas>
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full bg-zinc-900 border border-zinc-700 text-amber-500 font-bold text-xs shadow-2xl opacity-0 transition-opacity pointer-events-none uppercase tracking-widest z-50">Action effectuée ✓</div>

    <!-- CODE SOURCE DETAILODOCUS EMBARQUÉ -->
    <template id="detailodocus-template">
        <!DOCTYPE html>

            </style>
            <!-- BIBLIOTHÈQUE DE DONNÉES -->

        <body class="min-h-screen p-4 md:p-8 custom-scrollbar text-sm">
            <div id="toast-container" class="fixed top-4 right-4 z-[70] flex flex-col gap-2 pointer-events-none"></div>

                    <div class="flex gap-3 justify-end">
                        <button onclick="closeConfirmModal()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg text-xs font-bold transition-colors">Annuler</button>
                        <button id="confirm-yes-btn" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-bold transition-colors">Confirmer</button>

                </div>
            </div>

            <div class="max-w-[1400px] mx-auto space-y-6">

                            <div class="flex flex-col"><span class="text-[9px] uppercase text-zinc-500 font-bold mb-1">Quantité</span><input type="number" id="global-quantite" value="1" class="w-16 px-2 py-1 rounded text-right font-mono text-xs" onchange="updateGlobalMetrics()"></div>
                            <div class="flex flex-col"><span class="text-[9px] uppercase text-zinc-500 font-bold mb-1">Unité</span><input type="text" id="global-unite" value="u" class="w-16 px-2 py-1 rounded text-center text-xs"></div>

                            <div class="flex flex-col"><span class="text-[9px] uppercase text-amber-600 font-bold mb-1 flex items-center gap-1"><i data-lucide="percent" class="w-3 h-3"></i> Coef.2 (Marge)</span><input type="number" step="0.01" id="global-coef2" value="1.1" class="w-20 px-2 py-1 rounded text-right font-bold text-amber-500 font-mono text-sm bg-black/50 border-amber-900/50" onchange="calculateAll()"></div>
                        </div>

                        <!-- NOUVEAU BOUTON D'INTÉGRATION -->
                        <button onclick="sendToDevisaure()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-3 rounded-xl transition-colors flex items-center justify-center shadow-[0_0_15px_rgba(16,185,129,0.3)] gap-2 border border-emerald-400">

                        </button>
                    </div>
                </div>

                <div class="flex flex-col gap-6">
                    <!-- Résumé Financier -->
                    <div class="group-card p-4">
                        <div class="flex flex-col lg:flex-row gap-6">

                                <span class="text-[9px] font-semibold text-zinc-500 uppercase tracking-widest mb-2">Répartition des Coûts</span>
                                <div class="relative w-full h-24 flex justify-center"><canvas id="costBreakdownChart"></canvas></div>
                            </div>
                        </div>
                    </div>

                    <!-- Panneau principal : Le tableau de sous-détail -->
                    <div class="group-card p-5 overflow-x-auto custom-scrollbar">
                        <table class="w-full text-xs text-left border-collapse whitespace-nowrap">
                            <thead>
                                <tr class="text-zinc-500 border-b border-zinc-800 uppercase tracking-widest text-[9px]">

                                    <th class="p-2 w-12 text-center">Unité</th>
                                    <th class="p-2 w-20 text-right">PU Étude</th>
                                    <th class="p-2 w-24 text-right text-zinc-300">Déboursé</th>
                                    <th class="p-2">Observations</th>
                                    <th class="p-2 w-14 text-center">Coef.1</th>
                                    <th class="p-2 w-14 text-center">Coef.2</th>
                                    <th class="p-2 w-24 text-right text-amber-500">Px Vte HT</th>
                                    <th class="p-2 w-8"></th>
                                </tr>
                            </thead>
                            <tbody><tr><td colspan="12" class="p-2 mt-2 bg-zinc-900/50 font-bold text-amber-500 border-l-2 border-amber-500">MAIN D'ŒUVRE</td></tr></tbody>
                            <tbody id="tbody-MO"></tbody>
                            <tbody><tr class="border-t border-zinc-800 bg-black/20"><td colspan="6" class="text-right p-2 font-bold text-zinc-500 uppercase text-[10px] tracking-widest">Total Main d'œuvre</td><td class="p-2 text-right font-mono font-bold text-zinc-300" id="total-deb-MO">0.00</td><td colspan="3"></td><td class="p-2 text-right font-mono font-bold text-amber-500" id="total-vte-MO">0.00</td><td></td></tr></tbody>

                            <tbody><tr><td colspan="12" class="p-2 mt-4 bg-zinc-900/50 font-bold text-blue-400 border-l-2 border-blue-400">MATÉRIEL</td></tr></tbody>
                            <tbody id="tbody-MAT"></tbody>
                            <tbody><tr class="border-t border-zinc-800 bg-black/20"><td colspan="6" class="text-right p-2 font-bold text-zinc-500 uppercase text-[10px] tracking-widest">Total Matériel</td><td class="p-2 text-right font-mono font-bold text-zinc-300" id="total-deb-MAT">0.00</td><td colspan="3"></td><td class="p-2 text-right font-mono font-bold text-amber-500" id="total-vte-MAT">0.00</td><td></td></tr></tbody>

                            <tbody><tr><td colspan="12" class="p-2 mt-4 bg-zinc-900/50 font-bold text-emerald-400 border-l-2 border-emerald-400">FOURNITURES</td></tr></tbody>
                            <tbody id="tbody-FOU"></tbody>
                            <tbody><tr class="border-t border-zinc-800 bg-black/20"><td colspan="6" class="text-right p-2 font-bold text-zinc-500 uppercase text-[10px] tracking-widest">Total Fournitures</td><td class="p-2 text-right font-mono font-bold text-zinc-300" id="total-deb-FOU">0.00</td><td colspan="3"></td><td class="p-2 text-right font-mono font-bold text-amber-500" id="total-vte-FOU">0.00</td><td></td></tr></tbody>
                        </table>
                    </div>
                    
                    <div class="flex justify-end gap-4">
                         <button onclick="askClearStudy()" class="px-4 py-2 bg-zinc-900 hover:bg-rose-900/40 text-zinc-400 hover:text-rose-400 border border-zinc-800 hover:border-rose-900/50 rounded-xl transition-colors flex items-center gap-2 text-xs font-bold">
                            <i data-lucide="trash" class="w-4 h-4"></i> Vider l'étude
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tiroirs Latéraux (Logistique & Bibliothèque) -->
            <div id="rendement-drawer" class="fixed top-0 left-0 h-full w-80 bg-zinc-950 border-r border-zinc-800 shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 flex flex-col">
                <button onclick="toggleRendementDrawer()" class="absolute top-[30%] -translate-y-1/2 -right-10 w-10 h-28 bg-zinc-900 border-y border-r border-zinc-800 rounded-r-xl flex flex-col items-center justify-center cursor-pointer shadow-[4px_0_15px_rgba(0,0,0,0.5)] hover:bg-zinc-800 transition-colors group">
                    <i data-lucide="truck" class="w-5 h-5 mb-2 text-zinc-400 group-hover:text-amber-500 transition-colors"></i>
                    <i data-lucide="chevron-right" id="left-drawer-icon" class="w-4 h-4 text-zinc-500 group-hover:text-amber-500 transition-transform duration-300"></i>
                </button>
                <div class="p-5 flex-grow flex flex-col h-full overflow-y-auto custom-scrollbar space-y-8">
                    <div>
                        <div class="flex items-center justify-between mb-4 border-b border-zinc-800 pb-2"><h3 class="text-xs font-bold text-white uppercase tracking-widest flex items-center gap-2"><i data-lucide="truck" class="w-4 h-4 text-blue-400"></i> Logistique &amp; Débale</h3></div>
                        <div class="space-y-4">
                            <div class="space-y-1"><label class="text-[10px] uppercase tracking-widest text-zinc-400">Type de Camion</label><select id="calc-camion" class="w-full p-2 rounded-lg border text-xs" onchange="runTransportCalc()"><option value="15" selected="selected">Semi (15 m³)</option><option value="9">8x4 (9 m³)</option><option value="7">6x4 (7 m³)</option></select></div>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="space-y-1"><label class="text-[10px] uppercase tracking-widest text-zinc-400">Nb Camions</label><input type="number" id="calc-nb-camions" value="1" min="1" class="w-full p-2 rounded-lg border font-mono text-xs text-center" oninput="runTransportCalc()"></div>
                                <div class="space-y-1"><label class="text-[10px] uppercase tracking-widest text-zinc-400">Rotations / j</label><input type="number" id="calc-rotations" value="5" min="1" class="w-full p-2 rounded-lg border font-mono text-xs text-center" oninput="runTransportCalc()"></div>
                            </div>
                            <div class="grid grid-cols-2 gap-3 pt-2">
                                <div class="space-y-1"><label class="text-[9px] uppercase tracking-widest text-zinc-400">Densité (T/m³)</label><input type="number" id="calc-densite" value="1.8" step="0.1" class="w-full p-2 rounded-lg border font-mono text-xs text-right" oninput="runTransportCalc()"></div>
                                <div class="space-y-1"><label class="text-[9px] uppercase tracking-widest text-zinc-400">Débale (€/T)</label><input type="number" id="calc-cout-t" value="0.00" step="0.5" class="w-full p-2 rounded-lg border font-mono text-xs text-right" oninput="runTransportCalc()"></div>
                            </div>
                        </div>
                        <div class="mt-4 pt-4 border-t border-zinc-800 space-y-3">
                            <div class="bg-zinc-900/50 p-3 rounded-xl border border-zinc-800">
                                <div class="flex justify-between items-end mb-2"><span class="text-[10px] uppercase tracking-widest text-zinc-500">Rendement estimé</span><span class="text-base font-mono font-bold text-amber-500"><span id="res-rendement">75</span> m³/j</span></div>
                                <button onclick="applyRendementToGlobal()" class="w-full py-1.5 px-3 bg-amber-500/10 hover:bg-amber-500/20 text-amber-500 border border-amber-500/30 rounded-lg text-xs font-bold transition-colors flex justify-center items-center gap-2"><i data-lucide="arrow-right-circle" class="w-3 h-3"></i> Appliquer à l'étude</button>
                            </div>
                            <div class="bg-zinc-900/50 p-3 rounded-xl border border-zinc-800">
                                <div class="flex justify-between items-end mb-2"><span class="text-[10px] uppercase tracking-widest text-zinc-500">Coût Débale Vol.</span><span class="text-base font-mono font-bold text-emerald-400"><span id="res-cout-m3">0.00</span> €/m³</span></div>
                                <button onclick="addDebaleToStudy()" class="w-full py-1.5 px-3 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-lg text-xs font-bold transition-colors flex justify-center items-center gap-2"><i data-lucide="plus-circle" class="w-3 h-3"></i> Aux fournitures</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="config-drawer" class="fixed top-0 right-0 h-full w-[26rem] bg-zinc-950 border-l border-zinc-800 shadow-2xl z-50 transform transition-transform duration-300 flex flex-col translate-x-full">
                <button onclick="toggleConfigDrawer()" class="absolute top-[60%] -translate-y-1/2 -left-10 w-10 h-28 bg-zinc-900 border-y border-l border-zinc-800 rounded-l-xl flex flex-col items-center justify-center cursor-pointer shadow-[-4px_0_15px_rgba(0,0,0,0.5)] hover:bg-zinc-800 transition-colors group">
                    <i data-lucide="layers" class="w-5 h-5 mb-2 text-zinc-400 group-hover:text-amber-500 transition-colors"></i>
                    <i data-lucide="chevron-left" id="config-drawer-icon" class="w-4 h-4 text-zinc-500 group-hover:text-amber-500 transition-transform duration-300"></i>
                </button>
                <div class="p-5 flex-grow flex flex-col h-full overflow-hidden">
                    <div class="flex items-center justify-between mb-4 border-b border-zinc-800 pb-2 shrink-0">
                        <h3 class="text-xs font-bold text-white uppercase tracking-widest flex items-center gap-2"><i data-lucide="layers" class="w-4 h-4 text-purple-400"></i> Ouvrages Types</h3>
                    </div>
                    <div class="flex-1 overflow-y-auto custom-scrollbar pr-2 flex flex-col gap-1" id="compositions-list-container"></div>
                    <p class="text-[9px] text-zinc-600 text-center mt-2 mb-4 uppercase tracking-widest italic shrink-0">Double-clic pour injecter</p>
                    <div class="p-3 bg-zinc-900/50 rounded-xl border border-zinc-800 space-y-3 shrink-0">
                        <label class="text-[10px] uppercase tracking-widest text-zinc-400">Sauvegarder l'étude</label>
                        <input type="text" id="comp-name" placeholder="Ex: Tranchée..." class="w-full p-2 rounded-lg border border-zinc-800 focus:border-purple-500 text-xs bg-black text-zinc-200">
                        <button onclick="saveCurrentAsComposition()" class="w-full py-2 px-3 bg-zinc-800 hover:bg-purple-900/40 text-white hover:text-purple-400 rounded-lg text-xs font-bold transition-colors flex justify-center items-center gap-2 border border-zinc-700 hover:border-purple-500/50"><i data-lucide="save" class="w-3 h-3"></i> Mémoriser comme Ouvrage</button>
                    </div>
                </div>
            </div>

            <div id="library-drawer" class="fixed top-0 right-0 h-full w-[26rem] bg-zinc-950 border-l border-zinc-800 shadow-2xl z-50 transform transition-transform duration-300 flex flex-col translate-x-full">
                <button onclick="toggleLibrary()" class="absolute top-[30%] -translate-y-1/2 -left-10 w-10 h-28 bg-zinc-900 border-y border-l border-zinc-800 rounded-l-xl flex flex-col items-center justify-center cursor-pointer shadow-[-4px_0_15px_rgba(0,0,0,0.5)] hover:bg-zinc-800 transition-colors group">
                    <i data-lucide="book" class="w-5 h-5 mb-2 text-zinc-400 group-hover:text-amber-500 transition-colors"></i>
                    <i data-lucide="chevron-left" id="right-drawer-icon" class="w-4 h-4 text-zinc-500 group-hover:text-amber-500 transition-transform duration-300"></i>
                </button>
                <div class="p-5 flex-grow flex flex-col h-full">
                    <div class="flex items-center justify-between mb-4 border-b border-zinc-800 pb-2">
                        <h3 class="text-xs font-bold text-white uppercase tracking-widest flex items-center gap-2"><i data-lucide="database" class="w-4 h-4 text-zinc-400"></i> Bibliothèque</h3>
                        <button onclick="toggleLibrary()" class="text-zinc-500 hover:text-white transition-colors ml-2"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <div class="relative mb-4" id="lib-search-container">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500"></i>
                        <input type="text" id="search-lib" placeholder="Rechercher..." class="w-full pl-9 pr-3 py-2 text-xs rounded-lg border border-zinc-800 bg-zinc-900 focus:border-amber-500" onkeyup="filterLibrary()">
                    </div>
                    <div class="overflow-y-auto flex-grow custom-scrollbar pr-2" id="library-container"></div>
                </div>
            </div>

            <script>
                // LOGIQUE SPECIFIQUE DETAILODOCUS (simplifiée pour l'iframe)
                let prixLibrary = []; let sousDetailItems = []; let savedCompositions = []; let costChartInstance = null; let isLibraryEditMode = false;

                document.addEventListener('DOMContentLoaded', () => {
                    const libDataElement = document.getElementById('library-data');
                    if (libDataElement) prixLibrary = JSON.parse(libDataElement.textContent);
                    initChart(); runTransportCalc(); renderLibrary(); renderCompositionsList(); calculateAll(); lucide.createIcons();
                    
                    // Récupérer le nom de l'article via l'URL (hash) s'il y a un contexte
                    if(window.location.hash) {
                        const name = decodeURIComponent(window.location.hash.substring(1));
                        document.getElementById('dynamic-title').textContent = "SOUS-DÉTAIL : " + name.toUpperCase();
                    }
                });

                function showToast(message, type = 'success') {
                    const toast = document.createElement('div');
                    const bgColor = type === 'success' ? 'bg-emerald-600' : 'bg-rose-600';
                    toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-xl flex items-center gap-3 transform transition-all duration-300 translate-y-10 opacity-0 pointer-events-auto`;
                    toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-5 h-5"></i> <span class="text-xs font-bold">${message}</span>`;
                    document.getElementById('toast-container').appendChild(toast);
                    lucide.createIcons();
                    setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
                    setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
                }

                function showConfirm(message, callback) {
                    const modal = document.getElementById('confirm-modal');
                    const content = document.getElementById('confirm-modal-content');
                    document.getElementById('confirm-message').textContent = message;
                    window.confirmActionCallback = callback;
                    modal.classList.remove('hidden');
                    void modal.offsetWidth;
                    content.classList.remove('scale-95', 'opacity-0');
                }
                function closeConfirmModal() {
                    const modal = document.getElementById('confirm-modal');
                    const content = document.getElementById('confirm-modal-content');
                    content.classList.add('scale-95', 'opacity-0');
                    setTimeout(() => { modal.classList.add('hidden'); window.confirmActionCallback = null; }, 200);
                }
                document.getElementById('confirm-yes-btn').addEventListener('click', () => { if (window.confirmActionCallback) window.confirmActionCallback(); closeConfirmModal(); });

                function roundMax2(num) { return Math.round((num + Number.EPSILON) * 100) / 100; }
                
                let isLeftDrawerOpen = false;
                function toggleRendementDrawer() {
                    const drawer = document.getElementById('rendement-drawer');
                    const icon = document.getElementById('left-drawer-icon');
                    isLeftDrawerOpen = !isLeftDrawerOpen;
                    if (isLeftDrawerOpen) { drawer.classList.remove('-translate-x-full'); drawer.classList.add('z-[60]'); icon.classList.add('rotate-180'); } 
                    else { drawer.classList.add('-translate-x-full'); drawer.classList.remove('z-[60]'); icon.classList.remove('rotate-180'); }
                }

                let isConfigDrawerOpen = false;
                function toggleConfigDrawer() {
                    const drawer = document.getElementById('config-drawer');
                    const icon = document.getElementById('config-drawer-icon');
                    isConfigDrawerOpen = !isConfigDrawerOpen;
                    if (isConfigDrawerOpen) { if (isDrawerOpen) toggleLibrary(); drawer.classList.remove('translate-x-full'); drawer.classList.add('z-[60]'); icon.classList.add('rotate-180'); } 
                    else { drawer.classList.add('translate-x-full'); drawer.classList.remove('z-[60]'); icon.classList.remove('rotate-180'); }
                }

                let isDrawerOpen = false;
                function toggleLibrary() {
                    const drawer = document.getElementById('library-drawer');
                    const icon = document.getElementById('right-drawer-icon');
                    isDrawerOpen = !isDrawerOpen;
                    if (isDrawerOpen) { if (isConfigDrawerOpen) toggleConfigDrawer(); drawer.classList.remove('translate-x-full'); drawer.classList.add('z-[60]'); icon.classList.add('rotate-180'); } 
                    else { drawer.classList.add('translate-x-full'); drawer.classList.remove('z-[60]'); icon.classList.remove('rotate-180'); }
                }

                function filterLibrary() { renderLibrary(); }

                let calculatedRendement = 75; let calculatedCoutM3 = 0;
                function runTransportCalc() {
                    const volCamion = roundMax2(parseFloat(document.getElementById('calc-camion').value) || 0);
                    const nbCamions = Math.max(1, Math.round(parseFloat(document.getElementById('calc-nb-camions').value) || 1));
                    const rotations = roundMax2(parseFloat(document.getElementById('calc-rotations').value) || 0);
                    const densite = roundMax2(parseFloat(document.getElementById('calc-densite').value) || 1.8);
                    const coutT = roundMax2(parseFloat(document.getElementById('calc-cout-t').value) || 0);
                    calculatedRendement = roundMax2(nbCamions * volCamion * rotations);
                    document.getElementById('res-rendement').textContent = calculatedRendement;
                    calculatedCoutM3 = roundMax2(coutT * densite);
                    document.getElementById('res-cout-m3').textContent = calculatedCoutM3.toFixed(2);
                }

                function applyRendementToGlobal() {
                    document.getElementById('global-rendement').value = calculatedRendement;
                    const volCamion = document.getElementById('calc-camion').value;
                    const nbCamions = parseInt(document.getElementById('calc-nb-camions').value) || 1;
                    let targetDes = volCamion === '15' ? 'SEMI' : volCamion === '9' ? '8X4' : '6X4';
                    const baseItem = prixLibrary.find(i => i.des.includes(targetDes) && i.cat === 'MAT');
                    if (baseItem) {
                        let existingItem = sousDetailItems.find(i => i.des.includes(targetDes) && i.cat === 'MAT');
                        if (existingItem) { existingItem.nbre = nbCamions; existingItem.obs = 'Flotte transport ajustée'; } 
                        else { sousDetailItems.push({ ...baseItem, uid: Date.now() + Math.random(), nbre: nbCamions, duree: getCalculatedDuree(), dureeManuelle: false, obs: 'Atelier transport' }); }
                    }
                    const calcDuree = getCalculatedDuree();
                    sousDetailItems.forEach(item => { if ((item.cat === 'MO' || item.cat === 'MAT') && !item.dureeManuelle) item.duree = calcDuree; });
                    renderTables();
                }

                function addDebaleToStudy() {
                    if (calculatedCoutM3 <= 0) return; 
                    addItem({ cat: 'FOU', code: 'DEB', des: 'Frais de décharge / Débale', u: 'm³', pu: calculatedCoutM3, isCustom: true });
                }

                function renderCompositionsList() {
                    const container = document.getElementById('compositions-list-container');
                    if (!container) return;
                    container.innerHTML = '';
                    if (savedCompositions.length === 0) { container.innerHTML = '<div class="text-center text-zinc-600 text-[10px] italic py-4">Aucun ouvrage sauvegardé.</div>'; return; }
                    savedCompositions.forEach(comp => {
                        const div = document.createElement('div');
                        div.className = 'flex justify-between items-center p-2 rounded-lg border border-transparent hover:border-purple-500/30 hover:bg-purple-500/5 cursor-pointer select-none transition-colors group';
                        div.ondblclick = () => injectComposition(comp.id);
                        div.innerHTML = `<div class="flex flex-col overflow-hidden w-full pr-2"><span class="text-zinc-200 font-semibold text-xs truncate">${comp.name}</span></div>`;
                        container.appendChild(div);
                    });
                }

                function saveCurrentAsComposition() {
                    const name = document.getElementById('comp-name').value.trim();
                    if (!name || sousDetailItems.length === 0) return showToast("Nom vide ou tableau vide.", "error");
                    savedCompositions.push({ id: 'comp_' + Date.now(), name: name, items: sousDetailItems.map(item => ({ cat: item.cat, des: item.des, nbre: item.nbre, obs: item.obs, isCustom: item.isCustom || false, u: item.u, pu: item.pu })) });
                    document.getElementById('comp-name').value = '';
                    renderCompositionsList();
                    showToast(`Ouvrage type sauvegardé !`, "success");
                }

                function injectComposition(compId) {
                    const comp = savedCompositions.find(c => c.id === compId);
                    if (!comp) return;
                    comp.items.forEach(savedItem => {
                        let freshItem = prixLibrary.find(libItem => libItem.des === savedItem.des && libItem.cat === savedItem.cat);
                        if (!freshItem || savedItem.isCustom) freshItem = { cat: savedItem.cat, code: 'CFG', des: savedItem.des, u: savedItem.u, pu: savedItem.pu, isCustom: savedItem.isCustom };
                        sousDetailItems.push({ ...freshItem, uid: Date.now() + Math.random(), nbre: savedItem.nbre, duree: (freshItem.cat === 'MO' || freshItem.cat === 'MAT') ? getCalculatedDuree() : 1, dureeManuelle: false, obs: savedItem.obs || '' });
                    });
                    renderTables(); updateGlobalMetrics(); showToast(`Ouvrage ajouté !`, "success");
                }

                function renderLibrary() {
                    const container = document.getElementById('library-container');
                    container.innerHTML = '';
                    const query = document.getElementById('search-lib').value.toLowerCase();
                    ['MO', 'MAT', 'FOU'].forEach(cat => {
                        const title = document.createElement('div');
                        title.className = `font-bold text-[10px] tracking-widest uppercase p-1 mt-3 mb-1 border-b border-zinc-800 ${cat === 'MO' ? 'text-amber-500' : cat === 'MAT' ? 'text-blue-400' : 'text-emerald-400'}`;
                        title.innerText = cat === 'MO' ? "Main d'œuvre" : cat === 'MAT' ? "Matériel" : "Fournitures";
                        container.appendChild(title);
                        prixLibrary.forEach((item, index) => {
                            if (item.cat !== cat) return;
                            if (query && !item.des.toLowerCase().includes(query) && !item.code.toLowerCase().includes(query)) return;
                            const div = document.createElement('div');
                            div.className = 'flex justify-between items-center p-2 rounded-lg border border-transparent hover:border-zinc-800 hover:bg-zinc-900/50 cursor-pointer select-none transition-colors group';
                            div.ondblclick = () => addItem(item);
                            div.innerHTML = `<div class="flex flex-col"><span class="text-zinc-300 font-semibold text-xs">${item.code}</span><span class="truncate w-36 text-[10px] text-zinc-500 group-hover:text-zinc-300">${item.des}</span></div><span class="font-mono text-zinc-400 text-xs">${item.pu.toFixed(2)} €</span>`;
                            container.appendChild(div);
                        });
                    });
                }

                function askClearStudy() { showConfirm("Vider toutes les lignes de l'étude ?", () => { sousDetailItems = []; renderTables(); }); }

                function addItem(baseItem) {
                    sousDetailItems.push({ ...baseItem, uid: Date.now() + Math.random(), nbre: 1, duree: (baseItem.cat === 'MO' || baseItem.cat === 'MAT') ? getCalculatedDuree() : 1, dureeManuelle: false, obs: '' });
                    renderTables();
                }

                function removeItem(uid) { sousDetailItems = sousDetailItems.filter(i => i.uid !== uid); renderTables(); }

                function updateItem(uid, field, el) {
                    const item = sousDetailItems.find(i => i.uid === uid);
                    if(item) {
                        if (field === 'obs' || field === 'des' || field === 'u') item[field] = el.value;
                        else { let val = roundMax2(parseFloat(el.value) || 0); item[field] = val; if (field === 'pu') el.value = val.toFixed(2); else el.value = val; }
                        if (field === 'duree') item.dureeManuelle = true;
                        calculateAll();
                    }
                }

                function renderTables() {
                    ['MO', 'MAT', 'FOU'].forEach(cat => {
                        const tbody = document.getElementById(`tbody-${cat}`);
                        tbody.innerHTML = '';
                        sousDetailItems.filter(i => i.cat === cat).forEach(item => {
                            const tr = document.createElement('tr');
                            tr.className = 'border-b border-zinc-800/50 hover:bg-zinc-900/30 transition-colors group';
                            const desHtml = item.isCustom ? `<input type="text" value="${item.des}" class="w-full bg-zinc-950 border border-zinc-700 rounded px-1 py-1 text-zinc-200 focus:border-amber-500" onchange="updateItem(${item.uid}, 'des', this)">` : `<div class="truncate max-w-[200px] text-zinc-200">${item.des}</div>`;
                            const uHtml = item.isCustom ? `<input type="text" value="${item.u}" class="w-full text-center bg-zinc-950 border border-zinc-700 rounded px-1 py-1 text-zinc-200" onchange="updateItem(${item.uid}, 'u', this)">` : item.u;
                            const puHtml = item.isCustom ? `<input type="number" step="0.01" value="${item.pu.toFixed(2)}" class="w-full text-right bg-zinc-950 border border-zinc-700 rounded px-1 py-1 font-mono text-zinc-300" onchange="updateItem(${item.uid}, 'pu', this)">` : item.pu.toFixed(2);
                            const dureeHtml = item.cat === 'FOU' ? `<div class="text-center text-zinc-700 font-bold">-</div>` : `<input type="number" step="0.01" value="${item.duree}" class="w-full text-center border rounded px-1 py-1 text-zinc-300 font-mono" onchange="updateItem(${item.uid}, 'duree', this)">`;
                            tr.innerHTML = `
                                <td class="p-2 text-zinc-400">${item.code}</td><td class="p-2">${desHtml}</td>
                                <td class="p-2"><input type="number" step="0.01" value="${item.nbre}" class="w-full text-center border rounded px-1 py-1 text-zinc-300 font-mono" onchange="updateItem(${item.uid}, 'nbre', this)"></td>
                                <td class="p-2">${dureeHtml}</td><td class="p-2 text-center text-zinc-500">${uHtml}</td><td class="p-2 text-right font-mono text-zinc-400">${puHtml}</td>
                                <td class="p-2 text-right font-mono bg-zinc-900/30 text-zinc-200" id="deb-${item.uid}">0.00</td>
                                <td class="p-2"><input type="text" value="${item.obs}" class="w-full border rounded text-xs px-2 py-1 text-zinc-400" placeholder="Notes..." onchange="updateItem(${item.uid}, 'obs', this)"></td>
                                <td class="p-2 text-center text-zinc-600 font-mono text-[10px] bg-black/20 rounded-l-md coef1-display">1.16</td>
                                <td class="p-2 text-center text-zinc-600 font-mono text-[10px] bg-black/20 rounded-r-md coef2-display">1.10</td>
                                <td class="p-2 text-right font-mono bg-amber-500/5 text-amber-500/80 group-hover:text-amber-400" id="vte-${item.uid}">0.00</td>
                                <td class="p-2 text-center"><button onclick="removeItem(${item.uid})" class="text-zinc-600 hover:text-rose-500 transition-colors"><i data-lucide="trash-2" class="w-4 h-4 mx-auto"></i></button></td>
                            `;
                            tbody.appendChild(tr);
                        });
                    });
                    calculateAll(); lucide.createIcons();
                }

                function initChart() {
                    const ctx = document.getElementById('costBreakdownChart').getContext('2d');
                    costChartInstance = new Chart(ctx, { type: 'doughnut', data: { labels: ["MO", "MAT", "FOU"], datasets: [{ data: [1], backgroundColor: ['#27272a'], borderColor: '#09090b', borderWidth: 2 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { display: false }, tooltip: { enabled: false } } } });
                }

                function updateChart(mo, mat, fou) {
                    if (!costChartInstance) return;
                    if (mo === 0 && mat === 0 && fou === 0) { costChartInstance.data.datasets[0].data = [1]; costChartInstance.data.datasets[0].backgroundColor = ['#27272a']; } 
                    else { costChartInstance.data.datasets[0].data = [mo, mat, fou]; costChartInstance.data.datasets[0].backgroundColor = ['#f59e0b', '#60a5fa', '#34d399']; }
                    costChartInstance.update();
                }

                function getCalculatedDuree() {
                    const r = roundMax2(parseFloat(document.getElementById('global-rendement').value) || 1);
                    const q = roundMax2(parseFloat(document.getElementById('global-quantite').value) || 0);
                    return r > 0 ? roundMax2(q / r) : 0;
                }

                function updateGlobalMetrics() {
                    const calcDuree = getCalculatedDuree();
                    sousDetailItems.forEach(item => { if ((item.cat === 'MO' || item.cat === 'MAT') && !item.dureeManuelle) item.duree = calcDuree; });
                    calculateAll();
                }

                function forceUpdateDurations() {
                    const calcDuree = getCalculatedDuree();
                    sousDetailItems.forEach(item => { if (item.cat === 'MO' || item.cat === 'MAT') { item.duree = calcDuree; item.dureeManuelle = false; } });
                    renderTables();
                }

                function calculateAll() {
                    const coef1 = roundMax2(parseFloat(document.getElementById('global-coef1').value) || 1);
                    const coef2 = roundMax2(parseFloat(document.getElementById('global-coef2').value) || 1);
                    document.querySelectorAll('.coef1-display').forEach(el => el.textContent = coef1.toFixed(2));
                    document.querySelectorAll('.coef2-display').forEach(el => el.textContent = coef2.toFixed(2));

                    let globalDebourse = 0; let globalVenteStrict = 0; let dpC = { 'MO': 0, 'MAT': 0, 'FOU': 0 };

                    ['MO', 'MAT', 'FOU'].forEach(cat => {
                        let cD = 0; let cV = 0;
                        sousDetailItems.filter(i => i.cat === cat).forEach(item => {
                            const deb = roundMax2(item.cat === 'FOU' ? (item.nbre * item.pu) : (item.nbre * item.duree * item.pu));
                            const vte = roundMax2(deb * coef1 * coef2);
                            const elDeb = document.getElementById(`deb-${item.uid}`); const elVte = document.getElementById(`vte-${item.uid}`);
                            if(elDeb) elDeb.textContent = deb.toFixed(2); if(elVte) elVte.textContent = vte.toFixed(2);
                            cD += deb; cV += vte;
                        });
                        document.getElementById(`total-deb-${cat}`).textContent = cD.toFixed(2);
                        document.getElementById(`total-vte-${cat}`).textContent = cV.toFixed(2);
                        globalDebourse = roundMax2(globalDebourse + cD); globalVenteStrict = roundMax2(globalVenteStrict + cV); dpC[cat] = cD;
                    });

                    document.getElementById('summary-debourse').textContent = globalDebourse.toFixed(2) + ' €';
                    document.getElementById('summary-vente-total').textContent = globalVenteStrict.toFixed(2) + ' €';
                    
                    const qte = roundMax2(parseFloat(document.getElementById('global-quantite').value) || 1);
                    const puVente = qte > 0 ? roundMax2(globalVenteStrict / qte) : 0;
                    document.getElementById('summary-vente-unitaire').textContent = puVente.toFixed(2);

                    const marge = roundMax2(globalVenteStrict - globalDebourse);
                    document.getElementById('summary-marge').textContent = marge.toFixed(2) + ' €';
                    document.getElementById('summary-pourcentage-mb').textContent = (globalVenteStrict > 0 ? roundMax2((marge / globalVenteStrict) * 100) : 0).toFixed(2) + '%';
                    
                    updateChart(dpC['MO'], dpC['MAT'], dpC['FOU']);
                }

                // COMMUNICATION VERS DEVISAURE
                window.sendToDevisaure = function() {
                    const puText = document.getElementById('summary-vente-unitaire').textContent;
                    const pu = parseFloat(puText) || 0;
                    
                    let summary = "== SOUS-DÉTAIL DE PRIX ==\n";
                    sousDetailItems.forEach(i => {
                        const rowTotal = (i.cat === 'FOU' ? i.nbre * i.pu : i.nbre * i.duree * i.pu).toFixed(2);
                        const durLabel = i.cat === 'FOU' ? '' : ` (${i.duree} ${i.u})`;
                        summary += `• ${i.nbre}x ${i.des}${durLabel} à ${i.pu}€ = ${rowTotal}€ HT\n`;
                    });
                    
                    const coef1 = parseFloat(document.getElementById('global-coef1').value) || 1;
                    const coef2 = parseFloat(document.getElementById('global-coef2').value) || 1;
                    summary += `\n> Frais Généraux : ${((coef1-1)*100).toFixed(1)}% | Marge : ${((coef2-1)*100).toFixed(1)}%`;

                    window.parent.postMessage({ type: 'SAVE_SUBDETAIL', pu: pu, summary: summary }, '*');
                };
            </script>
        </body>
        </html>
    </template>

    <script>
        let data = [];
        let tvaRate = 0.20;
        let activeInputId = null;
        let activeSelectionStart = null;
        let draggedIndex = null;
        let isDeleteModeActive = false;
        let activeSubDetailItemId = null; // L'article en cours d'édition

        function saveFocus() {
            const activeEl = document.activeElement;
            if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT') && activeEl.id) {
                activeInputId = activeEl.id;
                try { activeSelectionStart = activeEl.selectionStart; } catch(e) { activeSelectionStart = null; }
            } else { activeInputId = null; }
        }

        function restoreFocus() {
            if (activeInputId) {
                const el = document.getElementById(activeInputId);
                if (el) {
                    el.focus();
                    try { if (activeSelectionStart !== null && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT')) el.setSelectionRange(activeSelectionStart, activeSelectionStart); } catch(e) {}
                }
            }
        }

        function createId() { return 'id-' + Math.random().toString(36).substr(2, 9); }
        
        function updateTva(rate) { tvaRate = parseFloat(rate); calculateTotals(); }

        function toggleDeleteMode() {
            isDeleteModeActive = !isDeleteModeActive;
            const btn = document.getElementById('delete-tool-btn');
            if (isDeleteModeActive) {
                btn.classList.add('kbd-btn-red');
                document.body.classList.add('delete-mode-active');
                showToast("Mode suppression activé");
            } else {
                btn.classList.remove('kbd-btn-red');
                document.body.classList.remove('delete-mode-active');
            }
        }

        function addItem(type) {
            if (isDeleteModeActive) toggleDeleteMode();
            
            data.push({ 
                id: createId(), 
                type: type, 
                name: '', 
                description: '', 
                image: null, 
                showDetails: false, 
                isCollapsed: false,
                qte: 0, 
                unit: 'u', 
                pu: 0
            });
            render();
            setTimeout(() => { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }, 50);
        }

        function removeItem(itemId) {
            data = data.filter(i => i.id !== itemId);
            if (isDeleteModeActive) toggleDeleteMode();
            render();
            showToast("Ligne supprimée");
        }

        function updateItemData(itemId, field, value) {
            const item = data.find(i => i.id === itemId);
            if (item) { item[field] = value; render(); }
        }

        function toggleItemDetails(itemId) {
            if (isDeleteModeActive) return;
            const item = data.find(i => i.id === itemId);
            if (item) { item.showDetails = !item.showDetails; render(); }
        }

        function toggleIndice(itemId) {
            if (isDeleteModeActive) return;
            const item = data.find(i => i.id === itemId);
            if (item && item.type === 'indice') {
                item.isCollapsed = !item.isCollapsed;
                render();
            }
        }

        // --- GESTION DU SOUS DETAIL ---
        function openSubDetail(itemId) {
            if (isDeleteModeActive) return;
            activeInputId = null; 
            activeSubDetailItemId = itemId;
            const item = data.find(i => i.id === itemId);
            const frame = document.getElementById('subdetail-frame');
            
            // On récupère le code pur de Detailodocus depuis la balise Template
            let tpl = document.getElementById('detailodocus-template').innerHTML;
            
            // On injecte le nom de l'article dans l'URL du iframe pour personnalisation
            const safeName = encodeURIComponent(item.name || "Article");
            frame.srcdoc = tpl + `<script>window.location.hash = '${safeName}';<\/script>`;
            
            document.getElementById('subdetail-drawer').classList.remove('-translate-x-full');
        }

        function closeSubDetail() {
            document.getElementById('subdetail-drawer').classList.add('-translate-x-full');
            setTimeout(() => {
                document.getElementById('subdetail-frame').srcdoc = '';
            }, 300); // Vidage après animation pour libérer la RAM
            activeSubDetailItemId = null;
            render();
        }

        // Écouteur pour réceptionner le prix envoyé par l'Iframe
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'SAVE_SUBDETAIL') {
                if (activeSubDetailItemId) {
                    const item = data.find(i => i.id === activeSubDetailItemId);
                    if (item) {
                        item.pu = e.data.pu;
                        item.description = e.data.summary;
                        item.showDetails = true; // On affiche la description pour prouver l'injection
                        render();
                        showToast("Prix calculé et appliqué avec succès !");
                    }
                    closeSubDetail();
                }
            }
        });

        function handleItemImageUpload(itemId, event) {
            const file = event.target.files[0];
            if (!file || file.size > 2 * 1024 * 1024) return showToast("Image < 2MB requise");
            const reader = new FileReader();
            reader.onload = (e) => { const item = data.find(i => i.id === itemId); if (item) { item.image = e.target.result; render(); } };
            reader.readAsDataURL(file);
        }

        function calculateItemTotal(item) {
            if (item.type !== 'article') return 0;
            const qte = parseFloat(item.qte) || 0; 
            const pu = parseFloat(item.pu) || 0;
            return qte * pu;
        }

        function calculateTotals() {
            let totalHT = data.reduce((sum, item) => sum + calculateItemTotal(item), 0);
            let montantTVA = totalHT * tvaRate;
            document.getElementById('total-ht').innerText = totalHT.toFixed(2) + ' €';
            document.getElementById('montant-tva').innerText = montantTVA.toFixed(2) + ' €';
            document.getElementById('total-ttc').innerText = (totalHT + montantTVA).toFixed(2) + ' €';
        }

        function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.opacity = '1'; setTimeout(() => t.style.opacity = '0', 2000); }

        function handleDragStart(e, index) {
            if (isDeleteModeActive) return e.preventDefault();
            draggedIndex = index;
            e.dataTransfer.setData('text/plain', index);
            e.currentTarget.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.item-card').forEach(c => c.classList.remove('drag-over'));
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('drag-over');
        }
        
        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e, targetIndex) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const sourceIndex = parseInt(e.dataTransfer.getData('text/plain'));
            if (sourceIndex !== targetIndex) {
                const movedItem = data.splice(sourceIndex, 1)[0];
                data.splice(targetIndex, 0, movedItem);
                render();
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[tag]));
        }

        function renderSubtotalRow(value) {
            const div = document.createElement('div');
            div.className = 'subtotal-row';
            div.innerHTML = `
                <div class="flex-1 flex justify-between items-center px-4">
                    <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Sous-Total Section HT</span>
                    <span class="font-mono font-black text-amber-500 text-lg">${value.toFixed(2)} €</span>
                </div>
            `;
            return div;
        }

        function renderItem(item, index, displayNumber) {
            const total = calculateItemTotal(item);
            const safeName = escapeHTML(item.name);
            const safeDesc = escapeHTML(item.description);
            const icon = item.type === 'indice' ? '🏷️' : '📦';

            const dragHandleHtml = `
                <div class="flex items-center gap-2 pl-3 pr-2 py-1 cursor-grab active:cursor-grabbing hover:scale-110 transition-transform origin-center select-none"
                     onmousedown="!isDeleteModeActive && (this.closest('.item-card').draggable = true)"
                     onmouseup="this.closest('.item-card').draggable = false"
                     onmouseleave="this.closest('.item-card').draggable = false">
                    <span class="text-zinc-600 font-mono text-[10px] w-6 text-center font-bold">${displayNumber}</span>
                    <span class="text-2xl drop-shadow-md">${icon}</span>
                </div>
            `;

            // Ajout du bouton 🧮 dans la barre d'action de droite
            const actionsHtml = `
                <div class="flex items-center gap-1 ml-2 pl-2 border-l border-zinc-800/50">
                    ${item.type === 'indice' ? `
                        <button onclick="toggleIndice('${item.id}')" class="w-6 h-6 flex items-center justify-center text-zinc-500 hover:text-white transition-colors font-bold text-xs bg-zinc-800 rounded-md border border-zinc-700">
                            ${item.isCollapsed ? '▶' : '▼'}
                        </button>
                    ` : ''}
                    ${item.type === 'article' ? `
                        <button onclick="openSubDetail('${item.id}')" class="p-1.5 rounded hover:bg-zinc-800 text-zinc-500 hover:text-emerald-500 transition-colors" title="Calculer Sous-détail (Detailodocus)">🧮</button>
                        <button onclick="toggleItemDetails('${item.id}')" class="p-1.5 rounded hover:bg-zinc-800 text-zinc-500 hover:text-amber-500 transition-colors" title="Description">📝</button>
                    ` : ''}
                </div>
            `;

            let mainRow = '';
            if (item.type === 'indice') {
                mainRow = `
                    <div class="flex items-center gap-2 w-full">
                        ${dragHandleHtml}
                        <div class="orange-pill flex-1 !bg-zinc-800 !border-zinc-700">
                            <span class="orange-pill-label !text-zinc-500">Titre de section</span>
                            <input id="name-${item.id}" type="text" placeholder="Désignation de la section..." value="${safeName}" oninput="updateItemData('${item.id}', 'name', this.value)" class="orange-pill-input !text-white !font-black !text-lg uppercase">
                        </div>
                        ${actionsHtml}
                    </div>`;
            } else {
                mainRow = `
                    <div class="flex items-center gap-2 w-full">
                        ${dragHandleHtml}
                        <div class="orange-pill flex-1 min-w-[200px]">
                            <span class="orange-pill-label">Article</span>
                            <input id="name-${item.id}" type="text" placeholder="Nom de l'article..." value="${safeName}" oninput="updateItemData('${item.id}', 'name', this.value)" class="orange-pill-input">
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="orange-pill w-24"><span class="orange-pill-label text-center">Quantité</span><input id="qte-${item.id}" type="text" inputmode="decimal" value="${item.qte || ''}" oninput="updateItemData('${item.id}', 'qte', this.value)" class="orange-pill-input text-center font-mono"></div>
                            <div class="orange-pill w-20"><span class="orange-pill-label text-center">Unité</span><select id="unit-${item.id}" onchange="updateItemData('${item.id}', 'unit', this.value)" class="orange-pill-input text-center uppercase cursor-pointer"><option value="ml" ${item.unit === 'ml' ? 'selected' : ''}>ML</option><option value="m2" ${item.unit === 'm2' ? 'selected' : ''}>M²</option><option value="m3" ${item.unit === 'm3' ? 'selected' : ''}>M³</option><option value="u" ${item.unit === 'u' ? 'selected' : ''}>UN</option><option value="ens" ${item.unit === 'ens' ? 'selected' : ''}>ENS</option></select></div>
                            <div class="orange-pill w-28"><span class="orange-pill-label text-right">Prix U. HT</span><input id="pu-${item.id}" type="text" inputmode="decimal" value="${item.pu || ''}" oninput="updateItemData('${item.id}', 'pu', this.value)" class="orange-pill-input text-right font-mono"></div>
                        </div>
                        <div class="dark-pill-display w-36 bg-black border-amber-900/50 ml-auto"><span class="dark-pill-label text-amber-600">Total Net</span><span class="dark-pill-value text-amber-500">${total.toFixed(2)} €</span></div>
                        ${actionsHtml}
                    </div>`;
            }

            const detailsPanel = (item.type === 'article' && item.showDetails) ? `<div class="mt-2 mb-2 p-4 bg-[#0a0a0b] border border-zinc-800 rounded-2xl flex gap-4 w-full ml-12">
                <div class="orange-box flex-1"><span class="orange-pill-label">Description détaillée</span><textarea id="desc-${item.id}" oninput="updateItemData('${item.id}', 'description', this.value)" class="orange-pill-input h-32 mt-1 whitespace-pre-wrap leading-relaxed">${safeDesc}</textarea></div>
                <div class="w-56">${item.image ? `<div class="relative w-full h-full bg-black border border-zinc-700 rounded-2xl overflow-hidden group/img"><img src="${item.image}" class="w-full h-full object-cover opacity-80" /><button onclick="updateItemData('${item.id}', 'image', null)" class="absolute inset-0 bg-black/70 opacity-0 group-hover/img:opacity-100 transition-opacity text-red-400 text-xs font-bold">Supprimer</button></div>` : `<label class="w-full h-full min-h-[5rem] border-2 border-dashed border-zinc-700 hover:border-zinc-500 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-colors bg-zinc-900 text-zinc-500 hover:text-zinc-300"><span class="text-xl mb-1">📸</span><input type="file" accept="image/*" class="hidden" onchange="handleItemImageUpload('${item.id}', event)"></label>`}</div>
            </div>` : '';

            const itemCard = document.createElement('div');
            itemCard.className = 'item-card';
            itemCard.onclick = () => {
                if (isDeleteModeActive) {
                    removeItem(item.id);
                }
            };
            itemCard.setAttribute('ondragstart', `handleDragStart(event, ${index})`);
            itemCard.setAttribute('ondragend', 'handleDragEnd(event)');
            itemCard.setAttribute('ondragover', 'handleDragOver(event)');
            itemCard.setAttribute('ondragleave', 'handleDragLeave(event)');
            itemCard.setAttribute('ondrop', `handleDrop(event, ${index})`);

            itemCard.innerHTML = `
                <div class="type-indicator type-indicator-${item.type}"></div>
                <div class="flex-1 w-full pl-1">
                    ${mainRow}
                    ${detailsPanel}
                </div>
            `;
            return itemCard;
        }

        function render() {
            saveFocus();
            const container = document.getElementById('items-container');
            container.innerHTML = '';
            
            if (data.length === 0) {
                container.innerHTML = '<div class="h-full flex flex-col items-center justify-center text-zinc-600 opacity-50 py-20 border-2 border-dashed border-zinc-800 rounded-3xl"><span class="text-4xl mb-4">🦖</span><p class="font-bold">Devis vide. Ajoutez une section ou un article.</p></div>';
            } else {
                let currentIndice = 0;
                let currentSubItem = 0;
                let isSectionCollapsed = false;
                let sectionTotal = 0;

                data.forEach((item, index) => {
                    if (item.type === 'indice') {
                        if (currentIndice > 0 && !isSectionCollapsed) {
                            container.appendChild(renderSubtotalRow(sectionTotal));
                        }
                        
                        currentIndice++;
                        currentSubItem = 0;
                        sectionTotal = 0;
                        isSectionCollapsed = item.isCollapsed;
                        container.appendChild(renderItem(item, index, currentIndice.toString()));
                    } else {
                        currentSubItem++;
                        sectionTotal += calculateItemTotal(item);
                        if (!isSectionCollapsed) {
                            const displayNumber = currentIndice > 0 ? `${currentIndice}.${currentSubItem}` : currentSubItem.toString();
                            container.appendChild(renderItem(item, index, displayNumber));
                        }
                    }
                    
                    if (index === data.length - 1 && currentIndice > 0 && !isSectionCollapsed) {
                        container.appendChild(renderSubtotalRow(sectionTotal));
                    }
                });
            }
            calculateTotals();
            restoreFocus();
        }

        function exportData() {
            if (isDeleteModeActive) toggleDeleteMode();
            if(!data.length) return showToast("Rien à sauvegarder");
            const a = document.createElement('a'); 
            a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })); 
            a.download = `Devisaure_${new Date().toISOString().slice(0,10)}.json`; 
            a.click(); 
            showToast("JSON exporté ✓");
        }

        function importData(e) {
            if (isDeleteModeActive) toggleDeleteMode();
            const f = e.target.files[0]; if (!f) return;
            const reader = new FileReader();
            reader.onload = (re) => { 
                try { 
                    const i = JSON.parse(re.target.result); 
                    data = Array.isArray(i) ? i : data; 
                    render(); 
                    showToast("Chargé ✓"); 
                } catch(e) { showToast("Fichier invalide"); } 
                e.target.value = ''; 
            };
            reader.readAsText(f);
        }

        async function generateImage() {
            if (isDeleteModeActive) toggleDeleteMode();
            if(!data.length) return showToast("Rien à exporter");
            const btn = document.getElementById('btn-generate-text'); btn.innerText = "Générat...";
            try {
                const canvas = document.getElementById('export-canvas'); const ctx = canvas.getContext('2d'); const pad = 50; const width = 1100;
                
                let tHeight = 250;
                let currentIndice = 0;
                data.forEach(i => {
                    if (i.type === 'indice') {
                        tHeight += 110;
                    } else {
                        tHeight += i.description ? 120 : 40;
                    }
                });
                tHeight += 100;
                
                canvas.width = width; canvas.height = tHeight;
                ctx.fillStyle = "#FFF"; ctx.fillRect(0,0,width,canvas.height);
                ctx.fillStyle = "#000"; ctx.font = "bold 36px sans-serif"; ctx.fillText("DEVIS - ESTIMATIF DÉTAILLÉ", pad, 70);
                ctx.fillStyle = "#666"; ctx.font = "14px sans-serif"; ctx.fillText("Édité le " + new Date().toLocaleString('fr-FR'), pad, 100);
                ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(pad,130); ctx.lineTo(width-pad,130); ctx.stroke();
                
                ctx.fillStyle = "#999"; ctx.font = "bold 12px sans-serif"; 
                ctx.fillText("N°", pad, 155); ctx.fillText("DÉSIGNATION", pad+40, 155); 
                ctx.textAlign = "right"; 
                ctx.fillText("QTE", width-pad-280, 155); ctx.textAlign = "center"; 
                ctx.fillText("UNITÉ", width-pad-220, 155); ctx.textAlign = "right"; 
                ctx.fillText("PRIX U.", width-pad-120, 155); ctx.fillText("TOTAL HT", width-pad, 155); ctx.textAlign = "left";

                let y = 190;
                let cIdx = 0;
                let cSub = 0;
                let sTotal = 0;

                data.forEach((item, index) => {
                    if (item.type === 'indice') {
                        if (cIdx > 0) {
                            ctx.fillStyle = "#F3F4F6"; ctx.fillRect(pad, y-25, width-pad*2, 45);
                            ctx.fillStyle = "#4B5563"; ctx.font = "bold 12px sans-serif"; ctx.fillText("SOUS-TOTAL SECTION HT", pad+15, y+5);
                            ctx.textAlign = "right"; ctx.fillStyle = "#000"; ctx.font = "bold 16px monospace";
                            ctx.fillText(sTotal.toFixed(2) + " €", width-pad-15, y+5); ctx.textAlign = "left";
                            y += 60;
                        }
                        cIdx++; cSub = 0; sTotal = 0;
                        ctx.fillStyle = "#27272a"; ctx.fillRect(pad, y-25, width-pad*2, 45);
                        ctx.fillStyle = "#FFF"; ctx.font = "bold 18px sans-serif";
                        ctx.fillText(cIdx + " - " + (item.name || "Titre de section").toUpperCase(), pad+15, y+5);
                        y += 50;
                    } else {
                        cSub++;
                        const itotal = calculateItemTotal(item);
                        sTotal += itotal;
                        const dispNum = cIdx > 0 ? `${cIdx}.${cSub}` : cSub.toString();
                        
                        // Calcul de hauteur du bloc pour accepter les retours à la ligne
                        const descLines = item.description ? item.description.split('\n') : [];
                        const rh = item.description ? 50 + (descLines.length * 15) : 40;

                        if (index % 2 === 0) { ctx.fillStyle = "#F9F9F9"; ctx.fillRect(pad, y-20, width-pad*2, rh); }
                        
                        ctx.fillStyle = "#999"; ctx.font = "bold 14px monospace"; ctx.fillText(dispNum, pad, y);
                        ctx.fillStyle = "#111"; ctx.font = "bold 15px sans-serif"; ctx.fillText(item.name || "Sans nom", pad+40, y);
                        ctx.fillStyle = "#555"; ctx.font = "14px monospace";
                        ctx.textAlign = "right"; ctx.fillText(parseFloat(item.qte||0).toString(), width-pad-280, y);
                        ctx.textAlign = "center"; ctx.fillText((item.unit||"").toUpperCase(), width-pad-220, y);
                        ctx.textAlign = "right"; ctx.fillText(parseFloat(item.pu||0).toFixed(2) + " €", width-pad-120, y);
                        ctx.fillStyle = "#000"; ctx.font = "bold 16px monospace"; ctx.fillText(itotal.toFixed(2)+" €", width-pad, y);
                        ctx.textAlign = "left";
                        
                        if(item.description) { 
                            ctx.fillStyle="#888"; ctx.font="italic 13px sans-serif"; 
                            descLines.forEach((line, i) => {
                                ctx.fillText((i===0 ? "↳ " : "  ") + line, pad+40, y+25+(i*15));
                            });
                        }
                        y += rh;
                    }
                    
                    if (index === data.length - 1 && cIdx > 0) {
                        ctx.fillStyle = "#F3F4F6"; ctx.fillRect(pad, y-25, width-pad*2, 45);
                        ctx.fillStyle = "#4B5563"; ctx.font = "bold 12px sans-serif"; ctx.fillText("SOUS-TOTAL SECTION HT", pad+15, y+5);
                        ctx.textAlign = "right"; ctx.fillStyle = "#000"; ctx.font = "bold 16px monospace";
                        ctx.fillText(sTotal.toFixed(2) + " €", width-pad-15, y+5); ctx.textAlign = "left";
                        y += 60;
                    }
                });
                
                let totalHT = data.reduce((s,i)=>s+calculateItemTotal(i),0);
                let tva = totalHT * tvaRate;
                ctx.fillStyle = "#E5E7EB"; ctx.fillRect(pad, y, width-pad*2, 120);
                ctx.textAlign = "right"; ctx.fillStyle = "#555"; ctx.font = "bold 18px monospace";
                ctx.fillText(`Total HT : ${totalHT.toFixed(2)} €`, width-pad-20, y+35);
                ctx.fillText(`TVA (${(tvaRate*100).toFixed(1)}%) : ${tva.toFixed(2)} €`, width-pad-20, y+60);
                ctx.fillStyle = "#111"; ctx.font = "bold 28px sans-serif"; ctx.fillText(`TOTAL TTC : ${(totalHT+tva).toFixed(2)} €`, width-pad-20, y+100);
                
                const l = document.createElement('a'); l.download = `Devis_Export_${new Date().toISOString().slice(0,10)}.png`; l.href = canvas.toDataURL(); l.click();
            } catch(e) { console.error(e); showToast("Erreur génération"); } finally { btn.innerText = "Image"; }
        }

        window.onload = () => render();
    </script>
</body>
</html>
